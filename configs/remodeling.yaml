remodeling:
  # Global fallback (used when per-layer refs absent or legacy mesh)
  psi_ref_pa: 0.25
  # Per-layer homeostatic SED setpoints (median true SED from mewing ENER output)
  psi_ref_cortical_pa: 0.24
  psi_ref_cancellous_pa: 0.02
  alpha_apposition: 0.001
  alpha_resorption: 0.002

  # --- LAZY ZONE (dead-band) ---
  # Physiological lazy zones are ~±10-20% for trabecular bone.
  # Previous value of 0.50 was too broad (50% dead-band suppressed most remodeling).
  # Narrowed to 0.15 per Frost's Mechanostat literature.
  lazy_zone_s: 0.15

  rho_min: 0.4
  rho_max: 1.5
  n_power: 2.0
  n_power_cortical: 3.0
  n_power_cancellous: 2.0
  E_bone_pa: 1.0e9
  E_suture_pa: 5.0e7
  E_cortical_pa: 1.5e10
  E_cancellous_pa: 5.0e8
  E_tooth_root_pa: 2.0e10
  cycles: 12
  cycle_label: months
  write_elem_modulus_debug: false

  # --- CYCLIC LOAD CORRECTION (Mechanostat / dynamic loading) ---
  # Real bone remodeling is driven by cyclic dynamic loads (e.g., swallowing),
  # not sustained static tongue posture. This block parameterizes the duty-cycle
  # correction: the effective SED seen by bone is a weighted average of the
  # resting load SED and an estimated peak-swallow SED.
  #
  # psi_eff = rest_frac * psi_rest + swallow_frac * psi_swallow
  # psi_swallow = psi_rest * (swallow_peak_kpa / tongue_kpa_ref)^2
  #
  # Literature: peak tongue pressures during swallowing ~ 30-50 kPa
  # (Adams et al. 2013, Cichero et al.). Swallowing ~2000x/day × ~0.5 s each.
  cyclic_loading:
    enabled: true
    swallow_cycles_per_day: 2000       # cycles/day (Adams 2013)
    swallow_duration_s: 0.5            # duration of each swallow bolus press
    swallow_peak_kpa: 35.0             # peak tongue-palate pressure during swallow
    tongue_kpa_ref: 2.0                # reference load case kPa (mewing baseline)

  suture_remodeling:
    enabled: true
    # Softening rate for exponential decay model (replaces linear approximation).
    # E_new = E_prev * exp(-beta * excess_strain)
    # beta=40 gives ~33% E drop at 0.025 excess strain (physiologically reasonable).
    beta: 40.0
    E_min_pa: 1.0e7
    strain_threshold: 0.00015
    # Sub-threshold creep recovery: suture stiffens back toward baseline when
    # strain stays below threshold (secondary ossification analog).
    # rate = fraction of (E_baseline - E_prev) recovered per cycle.
    recovery_rate: 0.05
    # Creep decay constant (cycles). At tau_creep cycles at threshold, E drops by 1/e.
    # Currently informational; drives beta scaling if cyclic_loading is enabled.
    tau_creep: 24.0
