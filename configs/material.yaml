# Legacy single-material key (read by extract_metrics.py and other non-remodeling scripts)
material:
  name: bone_isotropic
  youngs_modulus_pa: 1.0e9
  poisson_ratio: 0.3

# Multi-material zones — used by solver/make_inp.py for remodeling pipeline
# Adolescent suture modulus is ~20-50x softer than bone (open, fibrous suture)
materials:
  bone:
    youngs_modulus_pa: 1.0e9
    poisson_ratio: 0.3

  # ---------------------------------------------------------------------------
  # Suture — anisotropic fibrous joint with viscoelastic relaxation
  #
  # The midpalatal suture is NOT a simple isotropic spring: it is a collagen-
  # fibre-reinforced joint that undergoes stress-relaxation under sustained load.
  # We model this with a single-term Prony series (quasi-static approximation):
  #
  #   E_relax = E_inst * (1 - g1)      (long-term / relaxed modulus)
  #   E_inst  = youngs_modulus_pa       (instantaneous, peak-loading modulus)
  #
  # For CalculiX *STATIC steps the *VISCOELASTIC card has no in-step effect,
  # but it is written to the .inp deck for documentation and *VISCO upgrades.
  # For the mewing (sustained posture) load case, make_inp.py applies E_relax
  # to capture the long-term quasi-static stiffness. Other (transient) load
  # cases use E_inst.
  #
  # Literature:
  #   Meng et al. 2011 (suture Prony series, adolescent pig palate)
  #   Dean et al. 1996 (suture relaxation ~40-55% over 600 s)
  #   Provatidis et al. 2008 (viscoelastic suture FEA, palatal expansion)
  # ---------------------------------------------------------------------------
  suture:
    youngs_modulus_pa: 5.0e7        # E_inst: instantaneous (peak-load) modulus (Pa)
    poisson_ratio: 0.30
    viscoelastic:
      enabled: true
      # Single-term Prony series parameters
      # g1: normalized shear relaxation amplitude (dimensionless, 0 < g1 < 1)
      # k1: normalized bulk relaxation amplitude
      # tau1: relaxation time (s) — 600 s ~= swallowing episode, matches Dean 1996
      g1: 0.42          # 42% shear relaxation (Meng 2011: 40–55% range)
      k1: 0.30          # 30% bulk relaxation (collagen-rich tissue; k < g is typical)
      tau1: 600.0       # 10-minute relaxation time constant
      # Derived: E_relax = E_inst * (1 - g1) = 5e7 * 0.58 = 2.9e7 Pa
      # Used for sustained (mewing) load cases; E_inst used for transient cases.

  cortical:
    youngs_modulus_pa: 1.5e10
    poisson_ratio: 0.3
  cancellous:
    youngs_modulus_pa: 5.0e8
    poisson_ratio: 0.3
  tooth_root:
    youngs_modulus_pa: 2.0e10
    poisson_ratio: 0.31

  # ---------------------------------------------------------------------------
  # Orthotropic cortical bone — ENABLED
  #
  # Mandibular and maxillary cortical plates are strongly orthotropic: the
  # periosteal-endosteal (longitudinal) axis is ~50% stiffer than the transverse
  # directions. The isotropic model (E=15 GPa) underestimates stiffness along
  # the principal load path and overestimates transverse stiffness.
  #
  # In density-binned remodeling mode, all engineering constants are scaled by
  # rho^n_power_cortical (Carter-Hayes power law applied per axis):
  #   E_ij_eff(rho) = E_ij_ref * rho^n     (Young's and shear moduli)
  #   nu_ij stays constant                  (Poisson's ratios density-invariant)
  #
  # Constants from Turner 1999 (mandibular cortical plate):
  #   axis 1 = periosteal-endosteal (principal load direction)
  #   axis 2 = mesiodistal (transverse)
  #   axis 3 = inferosuperior (axial)
  # Units: Pa
  # ---------------------------------------------------------------------------
  cortical_ortho:
    enabled: true          # ENABLED — was false (isotropic scaffold only)
    # Principal moduli (Pa)
    E1_pa: 2.0e10          # longitudinal (periosteal-endosteal) — principal loading axis
    E2_pa: 1.3e10          # transverse (mesiodistal)
    E3_pa: 1.1e10          # axial (inferosuperior)
    # Shear moduli (Pa)
    G12_pa: 4.5e9
    G13_pa: 3.5e9
    G23_pa: 3.0e9
    # Poisson's ratios
    nu12: 0.30
    nu13: 0.32
    nu23: 0.28
    # CalculiX *ELASTIC, TYPE=ORTHO format (single line, 9 values):
    #   E1, E2, nu12, E3, nu13, nu23, G12, G13, G23
    # See CalculiX 2.21 manual §6.5.
